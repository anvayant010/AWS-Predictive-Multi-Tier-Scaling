services:
  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    container_name: predictive-scaling-timescaledb
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./forecasting/data_pipeline/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

volumes:
  timescaledb_data:
